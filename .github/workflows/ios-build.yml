name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List directory structure
        run: |
          echo "=== Project root structure ==="
          ls -la
          echo ""
          echo "=== Looking for xcodeproj ==="
          find . -maxdepth 1 -name "*.xcodeproj" -type d

      - name: List schemes
        run: |
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found!"
            exit 1
          fi
          echo "Using project: $PROJECT"
          xcodebuild -project "$PROJECT" -list

      - name: Build app for iOS Simulator
        run: |
          set -e
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found."
            exit 1
          fi
          echo "Building with project: $PROJECT"
          xcodebuild \
            -project "$PROJECT" \
            -scheme AlarmClockApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -derivedDataPath ./build \
            -verbose \
            build 2>&1 | tee build.log

      - name: Check build output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "=== Build Log (last 100 lines) ==="
            tail -100 build.log
          fi

      - name: Collect .app bundles
        if: always()
        run: |
          set -e || true
          mkdir -p ./build-products
          echo "Searching for .app bundles under ./build"
          find ./build -name "*.app" -type d -print0 | xargs -0 -I{} bash -c 'cp -R "{}" ./build-products/ || true'
          echo "Copied apps to ./build-products (if any):"
          ls -la ./build-products || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/
          if-no-files-found: warn

      - name: Upload built .app bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-apps
          path: build-products/
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
