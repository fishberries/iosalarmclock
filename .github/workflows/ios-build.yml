name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app for iOS Simulator
        run: |
          set -e
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found."
            exit 1
          fi
          echo "Using project: $PROJECT"
          xcodebuild -project "$PROJECT" -scheme AlarmClockApp -destination 'platform=iOS Simulator,name=iPhone 16' -configuration Debug build

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/
          if-no-files-found: error
